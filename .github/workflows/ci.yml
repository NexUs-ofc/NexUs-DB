name: Database CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check script/

  validate-ddl:
    name: Validate DDL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r .\requirements.txt

      - name: Create .env
        run: |
          echo "PG_HOST=localhost" >> .env
          echo "PG_PORT=5432" >> .env
          echo "PG_DATABASE=nexus_test" >> .env
          echo "PG_USER=testuser" >> .env
          echo "PG_PASSWORD=testpass" >> .env

      - name: Run migrations
        run: python -m script.dataload.src.main init

  validate-dataload:
    name: Validate Dataload
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          echo "PG_HOST=localhost" >> .env
          echo "PG_PORT=5432" >> .env
          echo "PG_DATABASE=nexus_test" >> .env
          echo "PG_USER=testuser" >> .env
          echo "PG_PASSWORD=testpass" >> .env
          echo "MONGO_URI=mongodb://localhost:27017" >> .env
          echo "MONGO_DB=nexus_test" >> .env

      - name: Run dataload
        run: python -m script.dataload.src.main all

      - name: Verify data
        run: |
          PGPASSWORD=testpass psql -h localhost -U testuser -d nexus_test -c "SELECT 'category' AS tbl, COUNT(*) FROM category UNION ALL SELECT 'food', COUNT(*) FROM food UNION ALL SELECT 'address', COUNT(*) FROM address UNION ALL SELECT 'profile', COUNT(*) FROM profile UNION ALL SELECT 'plan', COUNT(*) FROM plan UNION ALL SELECT 'pantry_item', COUNT(*) FROM pantry_item;"
